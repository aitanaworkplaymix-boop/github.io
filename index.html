<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Chiquiwawa 2025 S.L</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; text-align: center; }
        .info { background: #f5f5f5; padding: 30px; border-radius: 10px; margin-bottom: 30px; }
        .btn { background: #2196F3; color: white; padding: 15px 30px; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; }
        .btn:hover { background: #1976D2; }
        .legal { font-size: 12px; color: #666; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="info">
        <h1>Chiquiwawa 2025 S.L</h1>
        <p>📍 Calle Tolomeo, 1, Navalcarnero(Madrid)</p>
        <p>📞 Tel: 910 572 192 / 623 359 531</p>
        <p>✉️ info@chiquiwawa.com</p>
    </div>

    <button class="btn" onclick="addContact()">📱 Añadir a Contactos</button>

    <div class="legal">
        <p>Al hacer clic, usted acepta guardar los datos de contacto en su dispositivo.</p>
        <p>Los datos se utilizan únicamente para comunicarse con el establecimiento.</p>
    </div>

    <script>
        const contactData = {
            name: "Chiquiwawa 2025 S.L",
            tel: "910572192",
            tel2: "623359531",
            email: "info@chiquiwawa.com",
            adr: "Calle Tolomeo, 1, Navalcarneo(Madrid), España"
        };

        function addContact() {
            const vCard = `BEGIN:VCARD
VERSION:3.0
FN:${contactData.name}
TEL:${contactData.tel}
TEL:${contactData.tel2}
EMAIL:${contactData.email}
ADR:;;${contactData.adr};;;;
ORG:${contactData.name}
END:VCARD`;

            const a = document.createElement('a');
            const blob = new Blob([vCard], { type: 'text/vcard' });
            a.href = URL.createObjectURL(blob);
            a.download = `${contactData.name}.vcf`;
            a.click();
            alert("Archivo de contacto generado. Por favor, ábrelo para guardar.");
        }
    </script>
</body>
</html>
